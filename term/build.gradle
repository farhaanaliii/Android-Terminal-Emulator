apply plugin: 'com.android.application'

// The CMake build writes the BusyBox environment asset zips here (see
// ENV_ASSETS_DIR in src/main/jni/CMakeLists.txt); the directory is added
// to the assets source set below so the zips ship inside the APK.
def envAssetsDir = layout.buildDirectory.dir('generated/envAssets').get().asFile

android {
    namespace "jackpal.androidterm"
    compileSdk 35
    ndkVersion NDK_VERSION

    defaultConfig {
        applicationId "jackpal.androidterm"
        minSdk 26
        targetSdk 28
        versionCode 71
        versionName "1.0.70"

        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DENV_ASSETS_DIR=${envAssetsDir}"
            }
        }
    }

    sourceSets {
        main {
            assets.srcDir envAssetsDir
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }

    // targetSdk 28 is a deliberate product decision (the built-in
    // environment's executables need the pre-29 data-dir exec policy),
    // so the Play-oriented ExpiredTargetSdkVersion vital check does
    // not apply to this app and is the one check disabled here.
    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // Release signing material lives outside the repo. The keystore
    // path, passwords and alias come from the environment of the
    // machine running the build (RELEASE_KEYSTORE_PATH,
    // RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS,
    // RELEASE_KEY_PASSWORD); nothing is defaulted or committed, and a
    // release build without them fails at signing time.
    signingConfigs {
        release {
            if (System.getenv("RELEASE_KEYSTORE_PATH") != null) {
                storeFile file(System.getenv("RELEASE_KEYSTORE_PATH"))
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// The environment asset zips only exist once the native build has run,
// so asset merging must wait for it.
afterEvaluate {
    tasks.findByName('mergeDebugAssets')?.dependsOn('externalNativeBuildDebug')
    tasks.findByName('mergeReleaseAssets')?.dependsOn('externalNativeBuildRelease')
}

dependencies {
    implementation project(':emulatorview')
    implementation project(':libtermexec')
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'
}
