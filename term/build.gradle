apply plugin: 'com.android.application'

// The CMake build writes the BusyBox environment asset zips here (see
// ENV_ASSETS_DIR in src/main/jni/CMakeLists.txt); the directory is added
// to the assets source set below so the zips ship inside the APK.
def envAssetsDir = layout.buildDirectory.dir('generated/envAssets').get().asFile

android {
    namespace "jackpal.androidterm"
    compileSdk 35
    ndkVersion NDK_VERSION

    defaultConfig {
        applicationId "jackpal.androidterm"
        minSdk 26
        targetSdk 35
        versionCode 71
        versionName "1.0.70"

        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DENV_ASSETS_DIR=${envAssetsDir}"
            }
        }
    }

    sourceSets {
        main {
            assets.srcDir envAssetsDir
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

// The environment asset zips only exist once the native build has run,
// so asset merging must wait for it.
afterEvaluate {
    tasks.findByName('mergeDebugAssets')?.dependsOn('externalNativeBuildDebug')
    tasks.findByName('mergeReleaseAssets')?.dependsOn('externalNativeBuildRelease')
}

dependencies {
    implementation project(':emulatorview')
    implementation project(':libtermexec')
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'
}
